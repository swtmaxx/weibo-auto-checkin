[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "weibo-checkin-web"
version = "0.1.0"
description = "A self-hosted WebUI for Weibo Super Topic check-in"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "swtmaxx" },
]
keywords = ["weibo", "checkin", "chaohua", "super-topic", "fastapi", "self-hosted"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "itsdangerous>=2.2,<3",
    "argon2-cffi>=23,<26",
    "cryptography>=42,<47",
    "uvicorn>=0.30,<1",
    "websockets>=12,<18",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[project.urls]
Homepage = "https://github.com/swtmaxx/weibo-auto-checkin"
Repository = "https://github.com/swtmaxx/weibo-auto-checkin"
Issues = "https://github.com/swtmaxx/weibo-auto-checkin/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
