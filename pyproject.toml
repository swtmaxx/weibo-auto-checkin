[project]
name = "weibo-checkin-web"
version = "0.1.0"
description = "A self-hosted WebUI for Weibo Super Topic check-in"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "itsdangerous>=2.2,<3",
    "python-multipart>=0.0.9,<1",
    "argon2-cffi>=23,<26",
    "cryptography>=42,<47",
    "uvicorn[standard]>=0.30,<1",
    "websockets>=12,<18",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
